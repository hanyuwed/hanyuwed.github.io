<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ed">
  <meta name="description" content="Изучайте китайский, французский, корейский, арабский, итальянский и испанский с карточками, аудио и упражнениями на русском и узбекском.">
  <link rel="canonical" href="https://hanyuwed.github.io/">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>hanyuwed — Выбери язык</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./courses.css">
  <script src="./courses.js" defer></script>
</head>
<body>
  <div class="app">
    <header>
      <a class="brand" href="./"><span class="seal" aria-hidden="true">学</span><span>hanyuwed</span></a>
      <div id="interface-language" class="language-switch" role="group" aria-label="Язык интерфейса">
        <button type="button" lang="ru" data-language="ru" aria-label="Русский" aria-pressed="true">RU</button>
        <button type="button" lang="uz" data-language="uz" aria-label="O‘zbekcha" aria-pressed="false">UZ</button>
      </div>
    </header>
    <main>
      <div class="intro"><h1 data-uz="Qaysi tilni o‘rganmoqchisan?">Какой язык хочешь учить?</h1></div>
      <ul class="unit-grid course-list">
        <li>
          <a class="unit-tile course-link" href="./chinese.html">
            <span class="unit-symbol" lang="zh-Hans" aria-hidden="true">汉</span>
            <span class="unit-body">
              <span class="unit-title" data-uz="Xitoy tili">Китайский</span>
              <span class="unit-count" lang="zh-Hans">中文</span>
            </span>
          </a>
        </li>
        <li>
          <a class="unit-tile course-link" href="./fr/">
            <span class="unit-symbol french-symbol" lang="fr" aria-hidden="true">é</span>
            <span class="unit-body">
              <span class="unit-title" data-uz="Fransuz tili">Французский</span>
              <span class="unit-count" lang="fr">Français</span>
            </span>
          </a>
        </li>
        <li>
          <a class="unit-tile course-link" href="./ko/">
            <span class="unit-symbol" lang="ko" aria-hidden="true">한</span>
            <span class="unit-body">
              <span class="unit-title" data-uz="Koreys tili">Корейский</span>
              <span class="unit-count" lang="ko">한국어</span>
            </span>
          </a>
        </li>
        <li>
          <a class="unit-tile course-link" href="./ar/">
            <span class="unit-symbol" lang="ar" dir="rtl" aria-hidden="true">ع</span>
            <span class="unit-body">
              <span class="unit-title" data-uz="Arab tili">Арабский</span>
              <span class="unit-count" lang="ar" dir="rtl">العربية</span>
            </span>
          </a>
        </li>
        <li>
          <a class="unit-tile course-link" href="./it/">
            <span class="unit-symbol french-symbol" lang="it" aria-hidden="true">It</span>
            <span class="unit-body">
              <span class="unit-title" data-uz="Italyan tili">Итальянский</span>
              <span class="unit-count" lang="it">Italiano</span>
            </span>
          </a>
        </li>
        <li>
          <a class="unit-tile course-link" href="./es/">
            <span class="unit-symbol french-symbol" lang="es" aria-hidden="true">Es</span>
            <span class="unit-body">
              <span class="unit-title" data-uz="Ispan tili">Испанский</span>
              <span class="unit-count" lang="es">Español</span>
            </span>
          </a>
        </li>
      </ul>
      <footer class="course-feedback">
        <p data-uz="Taklifing bormi yoki muammoga duch keldingmi?">Есть идея или возникла проблема?</p>
        <a href="https://t.me/raiiis070" data-uz="Telegramda yoz · @raiiis070">Напиши в Telegram · @raiiis070</a>
      </footer>
    </main>
  </div>
</body>
</html>
